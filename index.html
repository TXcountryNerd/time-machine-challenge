<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Machine Challenge</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1410; color: #f5e9dc; padding: 24px 16px; }
  h1 { color: #e8742a; margin: 0 0 8px; }
  table { border-collapse: collapse; margin-top: 16px; width: 100%; max-width: 420px; }
  td, th { border: 1px solid #4a3a2e; padding: 6px; text-align: center; }
</style>
</head>
<body>
<h1>Time Machine Challenge</h1>
<p>Under construction. Phase 1 (player data) is loaded below.</p>
<div id="out">Loading…</div>
<script type="module">
  import { loadPlayers, cell, ERAS, POSITIONS } from './js/data.js';
  const out = document.getElementById('out');
  try {
    const { cards } = await loadPlayers();
    let html = `<p>${cards.length} era cards</p><table><tr><th></th>${POSITIONS.map(p => `<th>${p}</th>`).join('')}</tr>`;
    for (const e of ERAS) html += `<tr><th>${e}</th>${POSITIONS.map(p => `<td>${cell(cards, e, p).length}</td>`).join('')}</tr>`;
    out.innerHTML = html + '</table>';
  } catch (err) { out.textContent = err.message; }
</script>
</body>
</html>
